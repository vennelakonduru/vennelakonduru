name: Auto Green Contribution Streak

on:
  schedule:
    # Runs every day at 12:00 AM UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Auto commit to keep streak green
        run: |
          date > auto_activity.txt
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add auto_activity.txt
          git commit -m "chore: daily activity update [skip ci]" || exit 0
          git push
