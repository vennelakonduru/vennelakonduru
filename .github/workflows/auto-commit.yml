name: Auto Green Contribution Streak

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 12:00 AM UTC (5:30 AM IST)
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "Vennela Raghava Konduru"
          git config user.email "YOUR_GITHUB_NOREPLY_EMAIL"

      - name: Update activity file
        run: |
          echo "Last activity: $(date -u)" >> auto_activity.txt

      - name: Commit and Push Changes
        run: |
          git add auto_activity.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: daily activity update"
          git push
